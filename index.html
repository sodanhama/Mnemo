<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mnemo</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./script.js"></script></head>
<body>
    <header>
        <h1>Mnemo</h1>
    </header>
    <div id="main">
        <br>
        <div id="input-container">
            <input type="text" id="input-field" placeholder="press slash and start learning">
        </div>
        <br>
        <p id="or">---or---</p>

        <div style="display: flex; justify-content: center; align-items: center;">
            <button id="start-review-button">Start Review</button>
        </div>

        <div id="review-container" style="display:none;">
            <p id="card-front"></p>
            <p id="card-back" style="display:none;"></p>
            <div id="grade-buttons" style="display:none;">
                <button data-quality="0">Again</button>
                <button data-quality="3">Hard</button>
                <button data-quality="4">Good</button>
                <button data-quality="5">Easy</button>
            </div>
            <p id="review-status"></p>
        </div>
    </div>
    <br>
    <footer>
        <p>Made by sodanhama</p>
    </footer>
</body>
</html>
